name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      # moon resolves changed files against the PR base branch, so a shallow
      # checkout leaves it with no `main` ref and it exits 128.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          moon-version: '2.4.6'
      - run: moon run root:fmt

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Each platform's failures are independent findings — cancelling the
      # other legs on the first red one hides the rest of the list.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # moon resolves changed files against the PR base branch, so a shallow
      # checkout leaves it with no `main` ref and it exits 128.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy-${{ matrix.os }}
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          moon-version: '2.4.6'
      - run: moon run root:lint

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # moon resolves changed files against the PR base branch, so a shallow
      # checkout leaves it with no `main` ref and it exits 128.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          moon-version: '2.4.6'
      - run: moon run root:test

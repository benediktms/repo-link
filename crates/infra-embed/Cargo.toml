[package]
name = "infra-embed"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# NVIDIA GPU inference (RFC 0007 D7). Opt-in: requires the CUDA toolkit
# (nvcc) at build time, which CI/dev machines without a GPU must not need.
cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
]

[dependencies]
ports = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
tokenizers = { workspace = true }
hf-hub = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = "0.1"

[dev-dependencies]
tempfile = { workspace = true }

# On-device GPU inference (Metal) on macOS. The BERT kernels (layer-norm,
# GEMM) live in candle-nn / candle-transformers, so the feature must be
# enabled on all three crates — candle-core alone leaves the ops on CPU.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["metal"] }
candle-nn = { workspace = true, features = ["metal"] }
candle-transformers = { workspace = true, features = ["metal"] }
